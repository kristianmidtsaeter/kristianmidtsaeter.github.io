<style>
  /* Layout: full-bleed 3D-scene; et lite instrumentpanel øverst til venstre, kompass øverst til høyre, hjelpetekst nederst. */
  :root {
    --bg: #e4e7e6;
    --bg-2: #f3f4f3;
    --panel: rgba(250, 251, 250, 0.9);
    --fg: #1f2427;
    --muted: #61696e;
    --line: rgba(31, 36, 39, 0.13);
    --accent: #2f6b67;
    --accent-fg: #ffffff;
    --label-bg: rgba(255, 255, 255, 0.93);
    --label-fg: #1f2427;
    --font-ui: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a; --bg-2: #1f2427; --panel: rgba(27, 31, 34, 0.9); --fg: #e5e9ea; --muted: #9aa3a8;
      --line: rgba(229, 233, 234, 0.14); --accent: #7cc0b8; --accent-fg: #0f1a19;
      --label-bg: rgba(24, 28, 31, 0.92); --label-fg: #e5e9ea; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171a; --bg-2: #1f2427; --panel: rgba(27, 31, 34, 0.9); --fg: #e5e9ea; --muted: #9aa3a8;
    --line: rgba(229, 233, 234, 0.14); --accent: #7cc0b8; --accent-fg: #0f1a19;
    --label-bg: rgba(24, 28, 31, 0.92); --label-fg: #e5e9ea; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; color: var(--fg); font-family: var(--font-ui);
    background-color: var(--bg);
    background-image: radial-gradient(ellipse 80% 70% at 50% 40%, var(--bg-2), var(--bg));
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; outline: none; }
  #labels-layer { position: fixed; inset: 0; pointer-events: none; }

  #ui {
    position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .panel {
    pointer-events: auto; width: min(292px, 100%); min-width: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.45);
  }
  .panel summary {
    list-style: none; cursor: pointer; padding: 12px 14px; display: grid; gap: 2px;
  }
  .panel summary::-webkit-details-marker { display: none; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; display: flex; align-items: center; gap: 8px; }
  .tag { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); border: 1px solid currentColor; border-radius: 4px; padding: 1px 5px; }
  .chev { margin-left: auto; width: 10px; height: 10px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-3px); transition: transform 0.2s; }
  details:not([open]) .chev { transform: rotate(-45deg); }
  .body { display: grid; gap: 14px; padding: 2px 14px 14px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--line); padding: 3px; border-radius: 7px; }
  .seg button {
    font: 500 12.5px/1 var(--font-ui); color: var(--fg); background: transparent; border: 0; border-radius: 5px; padding: 8px 4px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
  .seg button:focus-visible, .check input:focus-visible, input[type="range"]:focus-visible, .panel summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .field { display: grid; gap: 6px; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; color: var(--muted); }
  .field-head output { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); font-size: 12px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg); cursor: pointer; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .rooms { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .rooms span:nth-child(even) { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); text-align: right; }

  .compass {
    pointer-events: none; flex: none; width: 54px; height: 54px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line);
    display: grid; place-items: center; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .compass svg { width: 40px; height: 40px; overflow: visible; }
  .compass text { font: 600 9px var(--font-ui); fill: var(--fg); }

  .hint { margin: 0; align-self: center; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; text-align: center; max-width: 100%; }

  .hint .touch { display: none; }
  @media (pointer: coarse) { .hint .mouse { display: none; } .hint .touch { display: inline; } }

  .room-label {
    font-family: var(--font-ui); color: var(--label-fg); background: var(--label-bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 7px 3px; text-align: center; line-height: 1.15; white-space: nowrap;
    box-shadow: 0 4px 14px -8px rgba(0, 0, 0, 0.5);
  }
  .room-label b { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .room-label span { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }

  #loading[hidden] { display: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

  @media (max-width: 520px) {
    .panel { width: min(260px, 100%); }
    .hint { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
<script type="importmap">

  "imports": {

<body>
<div id="stage"></div>
<div id="labels-layer"></div>

<div id="ui">
  <div class="top">
    <details class="panel" id="panel" open>
      <summary>
        <span class="eyebrow">3 rom · 72 m² BRA · 1:100</span>
        <h1>Leilighet B8 <span class="tag">Utkast 1</span><span class="chev" aria-hidden="true"></span></h1>
      </summary>
      <div class="body">
        <div class="seg" role="group" aria-label="Visning">
          <button type="button" id="view-3d" aria-pressed="true">3D</button>
          <button type="button" id="view-top" aria-pressed="false">Ovenfra</button>

        <div class="field">
          <label class="field-head" for="cut">Vegghøyde <output id="cut-out" for="cut">2,60 m</output></label>

        <div class="rooms" aria-label="Romoversikt">
          <span>Stue / kjøkken</span><span>29,0 m²</span>
          <span>Soverom</span><span>14,0 m²</span>
          <span>Sov / kontor</span><span>9,0 m²</span>
          <span>Gang</span><span>7,0 m²</span>
          <span>Bad</span><span>6,5 m²</span>
          <span>Bod</span><span>3,0 m²</span>
          <span>Balkong</span><span>11,5 m²</span>
        </div>
      </div>
    </details>
    <div class="compass" aria-label="Kompass">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-opacity="0.15"></circle>
        <g class="needle" id="needle">
          <text x="20" y="10" text-anchor="middle">N</text>
          <path d="M20 12 L23.5 21 L20 19.5 L16.5 21 Z" fill="#c2412d"></path>
          <path d="M20 33 L23.5 21 L20 22.5 L16.5 21 Z" fill="currentColor" fill-opacity="0.35"></path>

  </div>
  <p class="hint"><span class="mouse">Dra for å rotere · scroll for å zoome · høyreklikk og dra for å flytte</span><span class="touch">Én finger roterer · klyp for å zoome · to fingre flytter</span></p>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Mål fra plantegningen (målestokk 1:100), i meter.
   x = mot høyre på tegningen, z = nedover på tegningen, y = opp.
   ===================================================================== */
const H = 2.6;          // takhøyde
const DOOR_H = 2.1;     // innvendige dører
const CENTER = [4.85, 6.45];
const NORTH_DEG = 27;   // nordpil på tegningen: 27° med klokka fra "opp"

/* ---------- små hjelpere ---------- */
const rng = (seed) => () => {
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const std = (color, roughness = 0.8, metalness = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, side: THREE.DoubleSide, envMapIntensity: 0.65, ...extra });

function mk(geo, mat, parent, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  m.castShadow = o.cast ?? true;
  m.receiveShadow = true;
  if (o.name) m.name = o.name;
  parent.add(m);
  return m;
}
// boks: (x,z) er senter, y er underkant
function box(parent, mat, w, h, d, x, y, z, o = {}) {
  const r = o.r ? Math.min(o.r, Math.min(w, h, d) / 2 - 1e-4) : 0;
  const g = r > 0 ? new RoundedBoxGeometry(w, h, d, o.seg ?? 3, r) : new THREE.BoxGeometry(w, h, d);
  return mk(g, mat, parent, x, y + h / 2, z, o);
}
function cyl(parent, mat, rt, rb, h, x, y, z, o = {}) {
  return mk(new THREE.CylinderGeometry(rt, rb, h, o.seg ?? 24, 1, o.open ?? false), mat, parent, x, y + h / 2, z, o);
}
function group(parent, x = 0, z = 0, ry = 0, y = 0) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = ry;
  parent.add(g);
  return g;
}
// retning (dx,dz) -> rotasjon slik at lokal +Z peker dit
const face = (dx, dz) => Math.atan2(dx, dz);
const FACE_N = Math.PI, FACE_S = 0, FACE_E = Math.PI / 2, FACE_W = -Math.PI / 2;

function prism(pts, y0, y1) {
  const shape = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: y1 - y0, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);
  g.translate(0, y0, 0);
  return g;
}
function flatShape(pts, y = 0) {
  const shape = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)));
  const g = new THREE.ShapeGeometry(shape);
  g.rotateX(-Math.PI / 2);
  g.translate(0, y, 0);
  return g;
}

/* =====================================================================
   Teksturer (tegnes i canvas, ingen bilder lastes)
   ===================================================================== */
function canvasTex(w, h, draw, repeat = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = 8;
  return t;
}
const rgb = (r, g, b, a = 1) => `rgba(${r | 0},${g | 0},${b | 0},${a})`;

// Eik, brede bord (20 cm) som går langs z – som på bildene. 1024 px = 2 m.
const oakTex = canvasTex(1024, 1024, (g, S) => {
  const rnd = rng(7), cols = 10, pw = S / cols;
  for (let i = 0; i < cols; i++) {
    const cuts = [rnd() * S];
    if (rnd() < 0.7) cuts.push((cuts[0] + S * (0.35 + rnd() * 0.3)) % S);
    cuts.sort((a, b) => a - b);
    for (let k = 0; k < cuts.length; k++) {
      const y0 = cuts[k], y1 = k + 1 < cuts.length ? cuts[k + 1] : cuts[0] + S;
      const base = [214 + rnd() * 10, 181 + rnd() * 9, 140 + rnd() * 8];
      for (const off of [0, -S]) plank(g, i * pw, y0 + off, pw, y1 - y0, base, rng((i * 31 + k * 7) | 0));
    }
  }
  function plank(g, x, y, w, h, c, r) {
    g.save();
    g.beginPath(); g.rect(x, y, w, h); g.clip();
    g.fillStyle = rgb(...c); g.fillRect(x, y, w, h);
    for (let n = 0; n < 34; n++) {
      const gx = x + r() * w, dark = r() < 0.5;
      g.strokeStyle = dark ? rgb(140, 100, 64, 0.05 + r() * 0.07) : rgb(240, 214, 175, 0.05 + r() * 0.07);
      g.lineWidth = 0.6 + r() * 1.8;
      g.beginPath(); g.moveTo(gx, y);
      const amp = 1 + r() * 4, freq = 0.004 + r() * 0.01, ph = r() * 6;
      for (let yy = y; yy <= y + h; yy += 12) g.lineTo(gx + Math.sin(yy * freq + ph) * amp, yy);
      g.stroke();
    }
    if (r() < 0.2) {
      const kx = x + w * (0.25 + r() * 0.5), ky = y + h * r();
      g.fillStyle = rgb(130, 92, 58, 0.25);
      g.beginPath(); g.ellipse(kx, ky, 3 + r() * 3, 6 + r() * 6, 0, 0, Math.PI * 2); g.fill();
    }
    g.restore();
    g.fillStyle = rgb(110, 78, 50, 0.32);
    g.fillRect(x, y, 1.4, h);
    g.fillRect(x, y, w, 1.4);
  }
}, 0.5);

// Fliser 30×60 på bad og bod. 512 px = 1,2 m.
const tileTex = canvasTex(512, 512, (g, S) => {
  const rnd = rng(3), tw = S / 4, th = S / 2;
  g.fillStyle = rgb(150, 152, 153); g.fillRect(0, 0, S, S);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) {
    const v = 182 + rnd() * 8;
    g.fillStyle = rgb(v, v + 1, v + 2);
    g.fillRect(i * tw + 1.5, j * th + 1.5, tw - 3, th - 3);
  }
}, 1 / 1.2);

// Terrassebord på balkongen. 512 px = 1,2 m.
const deckTex = canvasTex(512, 512, (g, S) => {
  const rnd = rng(5), n = 10, bw = S / n;
  g.fillStyle = rgb(70, 56, 44); g.fillRect(0, 0, S, S);
  for (let i = 0; i < n; i++) {
    const c = [150 + rnd() * 16, 117 + rnd() * 12, 88 + rnd() * 10];
    g.fillStyle = rgb(...c); g.fillRect(i * bw + 2, 0, bw - 4, S);
    for (let k = 0; k < 10; k++) {
      g.strokeStyle = rgb(90, 60, 40, 0.15); g.lineWidth = 1;
      const x = i * bw + 4 + rnd() * (bw - 8);
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (rnd() - 0.5) * 6, S); g.stroke();
    }
  }
}, 1 / 1.2);

// Grått, grovstrikket teppe. 256 px = 0,5 m.
const rugTex = canvasTex(256, 256, (g, S) => {
  const rnd = rng(9);
  g.fillStyle = rgb(182, 179, 172); g.fillRect(0, 0, S, S);
  const step = 8;
  for (let y = 0; y < S; y += step) for (let x = 0; x < S; x += step) {
    const v = 190 + rnd() * 22, ox = (y / step) % 2 ? step / 2 : 0;
    g.fillStyle = rgb(v, v - 3, v - 9);
    g.beginPath(); g.ellipse(x + ox, y + step / 2, step * 0.48, step * 0.4, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = rgb(120, 117, 112, 0.25);
    g.beginPath(); g.ellipse(x + ox + 1, y + step * 0.8, step * 0.42, step * 0.14, 0, 0, Math.PI * 2); g.fill();
  }
}, 2);

// Plakaten over sofaen: tett, svart strektegning med noen røde og blå linjer.
const posterTex = canvasTex(1000, 720, (g, W, Hh) => {
  const r = rng(21);
  g.fillStyle = '#f5f4f0'; g.fillRect(0, 0, W, Hh);
  const cx = W * 0.5, cy = Hh * 0.52;
  for (let i = 0; i < 260; i++) {
    const a = r() * Math.PI * 2, len = 60 + r() * 420;
    const x0 = cx + (r() - 0.5) * 360, y0 = cy + (r() - 0.5) * 240;
    g.strokeStyle = `rgba(20,20,22,${0.12 + r() * 0.6})`;
    g.lineWidth = 0.4 + r() * 1.6;
    g.beginPath(); g.moveTo(x0, y0);
    g.quadraticCurveTo(x0 + Math.cos(a + 1) * len * 0.5, y0 + Math.sin(a + 1) * len * 0.5, x0 + Math.cos(a) * len, y0 + Math.sin(a) * len * 0.6);
    g.stroke();
  }
  for (let i = 0; i < 26; i++) {
    g.strokeStyle = i % 3 ? 'rgba(196,52,40,0.8)' : 'rgba(40,80,170,0.8)';
    g.lineWidth = 1.2 + r() * 1.5;
    const x0 = r() * W, y0 = r() * Hh * 0.9;
    g.beginPath(); g.moveTo(x0, y0);
    g.bezierCurveTo(cx, cy - 200 + r() * 400, cx + (r() - 0.5) * 400, cy, cx + (r() - 0.5) * 900, cy + (r() - 0.5) * 500);
    g.stroke();
  }
  g.fillStyle = 'rgba(20,20,22,0.85)';
  for (let i = 0; i < 18; i++) {
    const x = 560 + i * 22, y = 330 + Math.sin(i * 0.6) * 16;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 12, y); g.lineTo(x + 6, y + 10); g.fill();
  }
  g.fillStyle = 'rgba(20,20,22,0.55)';
  g.fillRect(120, Hh - 46, 230, 7); g.fillRect(420, Hh - 46, 160, 7); g.fillRect(650, Hh - 46, 230, 7);
}, 1);

// Maleriet ved balkongdøra: blå/grønne åser og et lite tun.
const paintingTex = canvasTex(600, 480, (g, W, Hh) => {
  const r = rng(33);
  g.fillStyle = '#2bb3b1'; g.fillRect(0, 0, W, Hh);
  g.fillStyle = '#1b2350';
  g.beginPath(); g.moveTo(0, 150); g.quadraticCurveTo(300, 20, W, 110); g.lineTo(W, 0); g.lineTo(0, 0); g.fill();
  const cols = ['#2f73b8', '#3a8f5a', '#57b06a', '#1f4f8c', '#2c9c8c', '#7cc36f', '#264a9a'];
  for (let i = 0; i < 70; i++) {
    g.fillStyle = cols[i % cols.length];
    const x = r() * W, y = 150 + r() * 300, w = 50 + r() * 120, h = 18 + r() * 40;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y - h * 0.4); g.lineTo(x + w * 0.9, y + h); g.lineTo(x - w * 0.1, y + h * 0.8); g.fill();
  }
  g.fillStyle = '#f1efe6'; g.fillRect(250, 360, 46, 34); g.fillRect(330, 352, 70, 42);
  g.fillStyle = '#b8402e'; g.fillRect(244, 352, 58, 10); g.fillRect(324, 342, 82, 12);
  g.fillStyle = '#8a5b2f'; g.fillRect(300, 400, 120, 14);
}, 1);

// Bokstavplakaten over hylla ved boden.

  const r = rng(44), letters = 'ABCDEFGHIJKLMNOPQRSTUVWX';

function chain(points, thick, closed) {
  const n = points.length, count = closed ? n : n - 1, segs = [];
  for (let i = 0; i < count; i++) {
    const a = points[i], b = points[(i + 1) % n];
    const dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz);
    const d = [dx / len, dz / len];
    segs.push({ a, b, d, n: [-d[1], d[0]], len, t: thick[i] });
  }
  const offPt = (s, p, side) => [p[0] + s.n[0] * s.t / 2 * side, p[1] + s.n[1] * s.t / 2 * side];
  function meet(s1, s2, side) {
    const p1 = offPt(s1, s1.a, side), p2 = offPt(s2, s2.a, side);
    const den = s1.d[0] * s2.d[1] - s1.d[1] * s2.d[0];
    if (Math.abs(den) < 1e-6) return p2;
    const wx = p2[0] - p1[0], wz = p2[1] - p1[1];
    const s = (wx * s2.d[1] - wz * s2.d[0]) / den;
    return [p1[0] + s1.d[0] * s, p1[1] + s1.d[1] * s];
  }
  segs.forEach((s, i) => {
    const prev = i > 0 || closed ? segs[(i - 1 + count) % count] : null;
    const next = i < count - 1 || closed ? segs[(i + 1) % count] : null;
    s.L0 = prev ? meet(prev, s, 1) : offPt(s, s.a, 1);
    s.R0 = prev ? meet(prev, s, -1) : offPt(s, s.a, -1);
    s.L1 = next ? meet(s, next, 1) : offPt(s, s.b, 1);
    s.R1 = next ? meet(s, next, -1) : offPt(s, s.b, -1);
  });
  return segs;
}
function wallPieces(s, openings = []) {
  const out = [];
  const at = (u, side) => [s.a[0] + s.d[0] * u + s.n[0] * s.t / 2 * side, s.a[1] + s.d[1] * u + s.n[1] * s.t / 2 * side];
  const corner = (u, side) => (u <= 1e-6 ? (side > 0 ? s.L0 : s.R0) : u >= s.len - 1e-6 ? (side > 0 ? s.L1 : s.R1) : at(u, side));
  const quad = (u0, u1) => [corner(u0, 1), corner(u1, 1), corner(u1, -1), corner(u0, -1)];
  let cur = 0;
  for (const o of [...openings].sort((p, q) => p.s0 - q.s0)) {
    if (o.s0 > cur + 1e-4) out.push(prism(quad(cur, o.s0), 0, H));
    if (o.sill > 0) out.push(prism(quad(o.s0, o.s1), 0, o.sill));
    if (o.head < H) out.push(prism(quad(o.s0, o.s1), o.head, H));
    cur = o.s1;
  }
  if (s.len > cur + 1e-4) out.push(prism(quad(cur, s.len), 0, H));
  return out;
}

/* ---------- vinduer, balkongdør, inngangsdør ---------- */
function wallFrame(s, u0, parent = apt) {
  const g = new THREE.Group();
  g.position.set(s.a[0] + s.d[0] * u0, 0, s.a[1] + s.d[1] * u0);
  g.rotation.y = Math.atan2(-s.d[1], s.d[0]); // lokal x langs veggen, lokal z mot rommet
  parent.add(g);
  return g;
}
function windowUnit(s, o) {
  const g = wallFrame(s, o.s0);
  g.name = 'vindu';
  const w = o.s1 - o.s0, h = o.head - o.sill, fz = -s.t / 2 + 0.11, fd = 0.08, fp = 0.06;
  box(g, M.frame, fp, h, fd, fp / 2, o.sill, fz);
  box(g, M.frame, fp, h, fd, w - fp / 2, o.sill, fz);
  box(g, M.frame, w, fp, fd, w / 2, o.sill, fz);
  box(g, M.frame, w, fp, fd, w / 2, o.head - fp, fz);
  if (o.transom) box(g, M.frame, w - 2 * fp, 0.05, fd * 0.8, w / 2, o.transom, fz);
  mk(new THREE.BoxGeometry(w - 2 * fp, h - 2 * fp, 0.008), M.glass, g, w / 2, o.sill + h / 2, fz, { cast: false });
  if (o.sill > 0) {
    const inner = s.t / 2 + 0.035, back = fz + fd / 2;
    box(g, M.white, w + 0.04, 0.025, inner - back, w / 2, o.sill - 0.005, (inner + back) / 2);
  }
}
function sliderUnit(s, o) {
  const g = wallFrame(s, o.s0);
  g.name = 'balkongdør';
  const w = o.s1 - o.s0, h = o.head, fz = -s.t / 2 + 0.12, fp = 0.07;
  box(g, M.frame, fp, h, 0.12, fp / 2, 0, fz);
  box(g, M.frame, fp, h, 0.12, w - fp / 2, 0, fz);
  box(g, M.frame, w, fp, 0.12, w / 2, h - fp, fz);
  box(g, M.steel, w, 0.02, 0.14, w / 2, 0, fz);
  const pw = (w - 2 * fp) / 2 + 0.04;
  [[fp + pw / 2, fz - 0.03], [w - fp - pw / 2, fz + 0.03]].forEach(([cx, cz]) => {
    box(g, M.frame, 0.055, h - fp - 0.02, 0.05, cx - pw / 2 + 0.0275, 0.02, cz);
    box(g, M.frame, 0.055, h - fp - 0.02, 0.05, cx + pw / 2 - 0.0275, 0.02, cz);
    box(g, M.frame, pw, 0.055, 0.05, cx, 0.02, cz);
    box(g, M.frame, pw, 0.055, 0.05, cx, h - fp - 0.055, cz);
    mk(new THREE.BoxGeometry(pw - 0.11, h - fp - 0.13, 0.008), M.glass, g, cx, (h - fp) / 2 + 0.01, cz, { cast: false });
  });
  // håndtak mot stua
  box(g, M.steel, 0.02, 0.32, 0.03, w - fp - pw + 0.08, 0.95, fz + 0.075);
}
function frontDoor(s, o) {
  const g = wallFrame(s, o.s0);
  g.name = 'inngangsdør';
  const w = o.s1 - o.s0;
  box(g, M.frontDoor, w - 0.02, DOOR_H - 0.02, 0.06, w / 2, 0.01, 0.02);
  box(g, M.steel, w, 0.012, s.t, w / 2, 0, 0);
  // håndtak og lås på innsiden (gangen)
  box(g, M.steel, 0.14, 0.022, 0.022, w - 0.2, 1.02, 0.08);
  box(g, M.black, 0.05, 0.16, 0.012, w - 0.12, 0.98, 0.056);
  addCasing(g, w, s.t, DOOR_H, true);
}
// karm og gerikt rundt en åpning (lokale koordinater)
function addCasing(g, w, t, hh, oneSide = false) {
  const jt = 0.025, depth = t + 0.02;
  box(g, M.white, jt, hh, depth, jt / 2, 0, 0, { cast: false });
  box(g, M.white, jt, hh, depth, w - jt / 2, 0, 0, { cast: false });
  box(g, M.white, w, jt, depth, w / 2, hh - jt, 0, { cast: false });
  for (const side of oneSide ? [1] : [1, -1]) {
    const z = side * (t / 2 + 0.006);
    box(g, M.white, 0.06, hh + 0.06, 0.012, -0.03, 0, z, { cast: false });
    box(g, M.white, 0.06, hh + 0.06, 0.012, w + 0.03, 0, z, { cast: false });
    box(g, M.white, w + 0.12, 0.06, 0.012, w / 2, hh, z, { cast: false });
  }
}
function interiorDoor(s, o) {
  const g = wallFrame(s, o.s0);
  const w = o.s1 - o.s0;
  addCasing(g, w, s.t, DOOR_H);
  if (!o.door) return;
  g.name = 'dør';
  const { hinge, side, angle } = o.door;
  const lw = w - 0.06, a = THREE.MathUtils.degToRad(angle);
  const pivot = new THREE.Group();
  pivot.position.set(hinge === 'start' ? 0.03 : w - 0.03, 0, side * (s.t / 2 - 0.03));
  const dir = hinge === 'start' ? 1 : -1;            // lukket: peker mot motsatt karm
  pivot.rotation.y = -dir * side * a;                 // åpner mot valgt side
  g.add(pivot);
  const leaf = new THREE.Group();
  leaf.position.x = dir * lw / 2;
  pivot.add(leaf);
  box(leaf, M.door, lw, 2.04, 0.04, 0, 0.01, -side * 0.0);
  for (const sz of [1, -1]) {
    box(leaf, M.steel, 0.12, 0.018, 0.018, dir * (lw / 2 - 0.12), 1.02, sz * 0.04);
    box(leaf, M.steel, 0.05, 0.05, 0.008, dir * (lw / 2 - 0.07), 1.0, sz * 0.024);
  }
}
perim.forEach((s, i) => (perimOpenings[i] || []).forEach((o) => {
  if (o.kind === 'window') windowUnit(s, o);
  else if (o.kind === 'slider') sliderUnit(s, o);
  else if (o.kind === 'front') frontDoor(s, o);
}));

function loungeChair(p, x, z, ry) {
  const g = group(p, x, z, ry);

    const a = k * Math.PI / 2 + Math.PI / 4;

  mk(bowl, M.chair, g).scale.z = 0.94;
  const cushion = new THREE.LatheGeometry([[0, 0], [0.27, 0], [0.305, 0.025], [0.31, 0.06], [0.28, 0.085], [0, 0.088]].map(([r, y]) => new THREE.Vector2(r, y)), 40);
  mk(cushion, M.chair, g, 0, 0.37, 0.02).scale.z = 0.92;
  // høyt, avrundet skall med armlener
  const nu = 44, nv = 14, uMax = 0.8 * Math.PI, pos = [], idx = [];
  const R = (y) => 0.375 * Math.pow(Math.max(0.02, 1 - ((y - 0.64) / 0.5) ** 2), 0.32);
  for (let i = 0; i <= nu; i++) {
    const u = -uMax + (2 * uMax * i) / nu, a = Math.abs(u) / uMax;
    const top = 0.62 + 0.46 * Math.pow(Math.max(0, 1 - a * a), 1.15);
    for (let j = 0; j <= nv; j++) {
      const y = 0.4 + (top - 0.4) * (j / nv), r = R(y);
      pos.push(Math.sin(u) * r, y, -Math.cos(u) * r * 0.94);
    }
  }
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    const a = i * (nv + 1) + j, b = a + nv + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const shell = new THREE.BufferGeometry();
  shell.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  shell.setIndex(idx);
  shell.computeVertexNormals();
  mk(shell, M.chair, g);
  const pillow = box(g, M.navy, 0.32, 0.26, 0.09, 0, 0.47, -0.21, { r: 0.04 });
  pillow.rotation.x = -0.25;
}

function pleated(rTop, rBot, h, pleats = 40, depth = 0.06) {
  const geo = new THREE.CylinderGeometry(rTop, rBot, h, pleats * 2, 1, true);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const k = Math.round(((Math.atan2(x, z) + Math.PI) / (2 * Math.PI)) * pleats * 2);
    const f = k % 2 === 0 ? 1 : 1 - depth;
    p.setX(i, x * f); p.setZ(i, z * f);
  }
  geo.computeVertexNormals();
  return geo;
}

function leafGeometry(len, w, droop) {
  const geo = new THREE.PlaneGeometry(w, len, 1, 6);
  geo.translate(0, len / 2, 0);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const t = p.getY(i) / len, taper = Math.sin(Math.min(1, t * 1.05) * Math.PI) * 0.85 + 0.15;
    p.setX(i, p.getX(i) * taper);
    p.setZ(i, droop * len * t * t);
    p.setY(i, len * t * (1 - 0.12 * droop * t));
  }
  geo.computeVertexNormals();
  return geo;
}
function scatterLeaves(parent, geo, mat, n, place, seed) {
  const inst = new THREE.InstancedMesh(geo, mat, n);
  const r = rng(seed), m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), s = new THREE.Vector3(), c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const t = place(r, v, e, i);
    q.setFromEuler(e);
    s.setScalar(t);
    m.compose(v, q, s);
    inst.setMatrixAt(i, m);
    c.setHSL(0.27 + r() * 0.06, 0.38 + r() * 0.15, 0.24 + r() * 0.12);
    inst.setColorAt(i, c);
  }
  inst.castShadow = true;
  inst.receiveShadow = true;
  parent.add(inst);
  return inst;
}

/* =====================================================================
   Kamera, kontroller og UI
   ===================================================================== */
// alle møbelmaterialer tegnes på begge sider, så kuttede møbler ser hele ut
scene.traverse((o) => { if (o.isMesh && o.material && o.material.side === THREE.FrontSide && o.name !== 'vegger' && o.name !== 'gulv') o.material.side = THREE.DoubleSide; });

const VIEWS = {
  home: { pos: new THREE.Vector3(-2.75, 18.4, -14.1), target: new THREE.Vector3(0.2, 0, 0.1) },
  top: { pos: new THREE.Vector3(0, 27, 0.01), target: new THREE.Vector3(0, 0, 0) },
};
function fitDistance(v) {
  // på smale skjermer trekkes kameraet litt bakover
  const aspect = window.innerWidth / window.innerHeight;
  const k = aspect < 0.6 ? 2.15 : aspect < 0.8 ? 1.8 : aspect < 1.1 ? 1.35 : 1;
  return v.pos.clone().sub(v.target).multiplyScalar(k).add(v.target);
}
camera.position.copy(fitDistance(VIEWS.home));
controls.target.copy(VIEWS.home.target);
controls.update();

let anim = null;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyTo(v) {
  const toPos = fitDistance(v), toTarget = v.target.clone();
  if (reduceMotion) { camera.position.copy(toPos); controls.target.copy(toTarget); needsRender = true; return; }
  anim = { fromPos: camera.position.clone(), fromTarget: controls.target.clone(), toPos, toTarget, t0: performance.now(), dur: 750 };
}
const btn3d = document.getElementById('view-3d'), btnTop = document.getElementById('view-top'), btnReset = document.getElementById('view-reset');
const setPressed = (b) => [btn3d, btnTop].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
btn3d.addEventListener('click', () => { setPressed(btn3d); flyTo(VIEWS.home); });
btnTop.addEventListener('click', () => { setPressed(btnTop); flyTo(VIEWS.top); });
btnReset.addEventListener('click', () => {
  setPressed(btn3d);
  cut.value = '2.6'; applyCut();
  showLabels.checked = true; applyLabels();
  flyTo(VIEWS.home);
});

const cut = document.getElementById('cut'), cutOut = document.getElementById('cut-out');
function applyCut() {
  const v = parseFloat(cut.value);
  cutPlane.constant = v >= H ? H + 0.01 : v;
  cutOut.value = `${v.toFixed(2).replace('.', ',')} m`;
  needsRender = true;
}
cut.addEventListener('input', applyCut);

const showLabels = document.getElementById('show-labels');
function applyLabels() { labels.forEach((l) => { l.visible = showLabels.checked; }); needsRender = true; }
showLabels.addEventListener('change', applyLabels);

const needle = document.getElementById('needle');
const northDir = new THREE.Vector3(Math.sin(THREE.MathUtils.degToRad(NORTH_DEG)), 0, -Math.cos(THREE.MathUtils.degToRad(NORTH_DEG)));
const pA = new THREE.Vector3(), pB = new THREE.Vector3();
function updateCompass() {
  pA.copy(controls.target).setY(0).project(camera);
  pB.copy(controls.target).setY(0).add(northDir).project(camera);
  const deg = Math.atan2((pB.x - pA.x) * window.innerWidth, (pB.y - pA.y) * window.innerHeight) * (180 / Math.PI);
  if (Number.isFinite(deg)) needle.setAttribute('transform', `rotate(${deg.toFixed(1)} 20 20)`);
}

let needsRender = true;
controls.addEventListener('change', () => { needsRender = true; });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  needsRender = true;
});
const panel = document.getElementById('panel');
if (window.matchMedia('(max-width: 520px)').matches) panel.open = false;
panel.addEventListener('toggle', () => { needsRender = true; });

const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
renderer.setAnimationLoop((now) => {
  if (anim) {
    const t = Math.min(1, (now - anim.t0) / anim.dur), k = ease(t);
    camera.position.lerpVectors(anim.fromPos, anim.toPos, k);
    controls.target.lerpVectors(anim.fromTarget, anim.toTarget, k);
    needsRender = true;
    if (t >= 1) anim = null;
  }
  const moved = controls.update();
  if (moved || needsRender) {
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    updateCompass();
    needsRender = false;
  }
});
document.getElementById('loading').hidden = true;
window.__apt = { scene, camera, controls, renderer, flyTo, VIEWS };
